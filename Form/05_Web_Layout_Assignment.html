<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Layout Assignment</title>
    <style>
        .container01{
            height: 500px;
            width: 100%;
            background-color: rgb(7, 7, 7);
            
            padding-top: 3px;
            padding-bottom: 3px;
        }
        header{
            height: 75px;
            width: 100%;
            background-color: rgba(217, 179, 54, 0.925);   
           
        }
        header>h1{
            color: white;
            text-align: center;
            margin-top: 3px;
            padding-top: 10px;
            
        }
        
        
        
        button{
            background-color: green;
            color: white;
            
            border: 2px solid red;
            display: flex;
            flex-direction: row;
            height: 35px;
            width: 200px;
            margin: 3px;
            border-radius: 3px;
        }
        button:hover{
            background-color: rgb(255, 0, 144);
        }
        
        .container02{
            background-color: pink;
            height: 100%;
            width: 1065px;
            margin-left: 400px;
            margin-bottom: 200px;
            
        }
    </style>
</head>
<body>
   <div class="container01">
<header>
<h1>Online Exam System</h1>
</header>
 <aside class="nav">
    <button >Home</button>
    <button >About Us</button>
    <button >Courses</button>
    <button >Product</button>
    <button >Service</button>
    <button >Gallery</button>
</aside>

<aside class="container02">

</aside>

   </div> 
</body>
</html>
