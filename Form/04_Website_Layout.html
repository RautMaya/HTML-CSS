<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Layout</title>  
</head>
<style>
  .container{
    margin-left: 150px;
    height: 720px;
    width: 1200px;
    background-color: green;
  }
  .Header{
    
    background-color: rgb(233, 206, 50);
    border: 5px solid green;
    height: 100px;
    
  }
  .Header>h1{
    color: white;
    text-align: center;
    font-size: xx-large;
  }
  .nav{
    height: 50px;
    background-color: aqua;
    border: 5px solid green;
    border-top: 2px solid green ;
    
  }
  .button01{
    height: 70%;
    width: 10%;
    background-color: green;
    color: white;
    margin: 3px;
    border: 0px;
    padding: 3px;
    border-radius: 3px;
  }
  .main{
    height: 450px;
    width: 1190px;
    background-color: pink;
    margin-left: 5px;
    padding-top: 25px;
    
  }
  .footer{
    height: 65px;
    width: 1190;
    background-color: black;
    margin: 5px;
  }
   .container01{
    height: 300px;
    width: 300px;
    background-color: red;
    margin-left: 780px;
    padding: 2px;
    border-radius: 7px;
  }
  button:hover{
    background-color: red;
    
  }
  
</style>
<body>
 <div class="container">
  <div class="Header" >
    <h1>Online Exam System</h1>
  </div>
   <div class="nav">
  
    <button class="button01">HOME</button>
    <button class="button01">ABOUT US</button>
    <button class="button01">COURSES</button>
    <button class="button01">EXAM</button>
    <button class="button01">LOGIN</button>
    <button class="button01">RESULT</button>
  
  </div>


  <div class="main">
   <div class="container01" >

   </div>
  </div>
  <div class="footer">

  </div>
 </div>
</body>
</html>
